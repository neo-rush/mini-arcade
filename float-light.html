<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="迷你街机">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <title>浮光 · 翻转重力</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6fbff;
      --muted: rgba(215, 228, 255, 0.62);
      --soft: rgba(231, 242, 255, 0.1);
      --cyan: #73f7ff;
      --aqua: #83ffc8;
      --violet: #9f8cff;
      --pink: #ff70bd;
      --danger: #ff5d7d;
      --panel: rgba(9, 13, 33, 0.82);
      --panel-border: rgba(190, 226, 255, 0.15);
      --shadow: 0 30px 100px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background:
        radial-gradient(circle at 20% 12%, rgba(86, 73, 211, 0.24), transparent 32%),
        radial-gradient(circle at 80% 86%, rgba(28, 190, 204, 0.14), transparent 35%),
        #03050f;
    }

    body {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .game {
      position: relative;
      isolation: isolate;
      width: 100vw;
      height: 100dvh;
      min-height: 320px;
      overflow: hidden;
      touch-action: none;
      background:
        radial-gradient(ellipse at 78% 16%, rgba(99, 79, 218, 0.19), transparent 34%),
        radial-gradient(ellipse at 15% 78%, rgba(28, 188, 198, 0.12), transparent 36%),
        linear-gradient(165deg, #070b1d 0%, #07091a 48%, #0c0a22 100%);
    }

    .game::before {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(90deg, rgba(4, 7, 18, 0.44), transparent 12%, transparent 88%, rgba(4, 7, 18, 0.44)),
        linear-gradient(0deg, rgba(3, 5, 15, 0.48), transparent 20%, transparent 80%, rgba(3, 5, 15, 0.35));
    }

    .game::after {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      content: "";
      opacity: 0.2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .sweep {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -35%;
      z-index: 2;
      width: 22%;
      pointer-events: none;
      opacity: 0.34;
      transform: skewX(-12deg);
      background: linear-gradient(90deg, transparent, rgba(139, 224, 255, 0.1), transparent);
      animation: sweep 8s linear infinite;
    }

    @keyframes sweep {
      from { transform: translateX(-30vw) skewX(-12deg); }
      to { transform: translateX(150vw) skewX(-12deg); }
    }

    .hud {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        0
        max(14px, env(safe-area-inset-left));
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .hud.is-hidden {
      opacity: 0;
      transform: translateY(-8px);
      visibility: hidden;
      pointer-events: none;
    }

    .score {
      display: grid;
      gap: 1px;
      min-width: 92px;
    }

    .eyebrow {
      color: rgba(217, 233, 255, 0.54);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.22em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    #scoreValue {
      font-size: clamp(23px, 6vw, 30px);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      letter-spacing: 0.015em;
      line-height: 1;
      text-shadow: 0 0 24px rgba(115, 247, 255, 0.22);
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: auto;
    }

    .shard-pill,
    .shield-pill {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      gap: 5px;
      padding: 0 10px;
      border: 1px solid rgba(183, 232, 255, 0.12);
      border-radius: 999px;
      color: #dffcff;
      background: rgba(5, 10, 27, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      backdrop-filter: blur(12px);
    }

    .shard-icon {
      width: 8px;
      height: 8px;
      background: var(--cyan);
      box-shadow: 0 0 10px rgba(115, 247, 255, 0.85);
      transform: rotate(45deg);
    }

    .shield-pill {
      color: #fff7cc;
      border-color: rgba(255, 238, 165, 0.2);
      background: rgba(93, 81, 38, 0.26);
    }

    .shield-pill[hidden] {
      display: none;
    }

    .icon-button {
      display: inline-grid;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 1px solid rgba(183, 232, 255, 0.12);
      border-radius: 50%;
      color: rgba(236, 246, 255, 0.8);
      background: rgba(5, 10, 27, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .icon-button:active {
      transform: scale(0.93);
    }

    .pause-icon {
      display: inline-flex;
      gap: 3px;
    }

    .pause-icon::before,
    .pause-icon::after {
      width: 3px;
      height: 11px;
      border-radius: 2px;
      content: "";
      background: currentColor;
    }

    .hint {
      position: absolute;
      right: 0;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 16px));
      left: 0;
      z-index: 14;
      display: flex;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 300ms ease, transform 300ms ease;
    }

    .hint.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hint span {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid rgba(190, 226, 255, 0.1);
      border-radius: 999px;
      color: rgba(228, 241, 255, 0.64);
      background: rgba(6, 10, 25, 0.44);
      font-size: 11px;
      letter-spacing: 0.08em;
      backdrop-filter: blur(10px);
    }

    .hint i {
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
      animation: hintPulse 1.5s ease-in-out infinite;
    }

    @keyframes hintPulse {
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      opacity: 1;
      visibility: visible;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .screen::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        radial-gradient(circle at 50% 44%, rgba(29, 37, 86, 0.26), transparent 46%),
        linear-gradient(180deg, rgba(2, 5, 17, 0.22), rgba(2, 5, 17, 0.58));
      backdrop-filter: blur(2px);
    }

    .screen-inner {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(100%, 380px);
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .orb-mark {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }

    .orb-mark::before {
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      content: "";
      background: radial-gradient(circle at 36% 31%, #fff, #93feff 22%, #4ac4ff 47%, #6457db 74%);
      box-shadow:
        0 0 18px rgba(115, 247, 255, 0.75),
        0 0 60px rgba(105, 104, 255, 0.35);
      animation: breathe 3.4s ease-in-out infinite;
    }

    .orb-mark::after {
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(150, 236, 255, 0.35);
      border-right-color: rgba(255, 112, 189, 0.8);
      border-radius: 50%;
      content: "";
      transform: rotate(-26deg) scaleY(0.38);
      box-shadow: 0 0 12px rgba(115, 247, 255, 0.18);
      animation: orbit 7s linear infinite;
    }

    @keyframes breathe {
      50% { transform: scale(0.92); filter: brightness(1.15); }
    }

    @keyframes orbit {
      to { transform: rotate(334deg) scaleY(0.38); }
    }

    .kicker {
      margin: 0 0 9px;
      color: rgba(196, 226, 255, 0.52);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 19vw, 94px);
      font-weight: 850;
      letter-spacing: -0.09em;
      line-height: 0.94;
      background: linear-gradient(145deg, #ffffff 12%, #bdfcff 45%, #a3a0ff 76%, #ff9bd1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 28px rgba(115, 247, 255, 0.21));
    }

    h1 span {
      display: inline-block;
    }

    h1 span + span {
      margin-left: -0.03em;
    }

    .tagline {
      max-width: 270px;
      margin: 18px 0 0;
      color: rgba(222, 235, 255, 0.68);
      font-size: 13px;
      font-weight: 450;
      letter-spacing: 0.055em;
      line-height: 1.75;
    }

    .how-to {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 27px;
      color: rgba(233, 244, 255, 0.8);
      font-size: 12px;
      letter-spacing: 0.053em;
    }

    .tap-glyph {
      position: relative;
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(137, 236, 255, 0.25);
      border-radius: 50%;
      background: rgba(115, 247, 255, 0.07);
    }

    .tap-glyph::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      content: "";
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .tap-glyph::after {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(115, 247, 255, 0.28);
      border-radius: 50%;
      content: "";
      animation: tapRing 1.8s ease-out infinite;
    }

    @keyframes tapRing {
      from { opacity: 0.75; transform: scale(0.35); }
      to { opacity: 0; transform: scale(1.2); }
    }

    .primary-button,
    .secondary-button {
      min-height: 54px;
      border-radius: 17px;
      cursor: pointer;
    }

    .primary-button {
      position: relative;
      display: flex;
      width: 100%;
      max-width: 290px;
      align-items: center;
      justify-content: center;
      gap: 17px;
      margin-top: 25px;
      padding: 0 22px;
      overflow: hidden;
      border: 1px solid rgba(222, 255, 255, 0.46);
      color: #07101e;
      background: linear-gradient(110deg, #d8ffff 0%, #83f7ff 48%, #8effc9 100%);
      box-shadow:
        0 11px 34px rgba(71, 220, 235, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .primary-button::after {
      position: absolute;
      top: -60%;
      left: -30%;
      width: 34%;
      height: 220%;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      animation: buttonShine 3.7s ease-in-out infinite;
    }

    @keyframes buttonShine {
      0%, 58% { transform: translateX(-40px) skewX(-20deg); }
      78%, 100% { transform: translateX(340px) skewX(-20deg); }
    }

    .primary-button:active {
      transform: translateY(1px) scale(0.985);
    }

    .button-arrow {
      font-size: 17px;
      line-height: 1;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 13px;
      margin-top: 18px;
      color: rgba(208, 226, 250, 0.42);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .meta-line b {
      color: rgba(236, 247, 255, 0.72);
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(187, 221, 255, 0.32);
    }

    .result-screen .screen-inner {
      max-width: 340px;
    }

    .result-kicker {
      color: rgba(191, 226, 255, 0.5);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.27em;
      text-transform: uppercase;
    }

    .result-screen h2 {
      margin: 9px 0 24px;
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 720;
      letter-spacing: -0.04em;
    }

    .result-score {
      color: #f9ffff;
      font-size: clamp(66px, 19vw, 88px);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: -0.065em;
      line-height: 0.9;
      text-shadow: 0 0 42px rgba(115, 247, 255, 0.18);
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      margin-top: 13px;
      padding: 0 11px;
      border: 1px solid rgba(108, 255, 209, 0.26);
      border-radius: 999px;
      color: #baffdf;
      background: rgba(66, 210, 168, 0.09);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .result-badge[hidden] {
      display: none;
    }

    .result-stats {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 25px;
      overflow: hidden;
      border: 1px solid rgba(183, 226, 255, 0.1);
      border-radius: 16px;
      background: rgba(8, 13, 33, 0.48);
      backdrop-filter: blur(12px);
    }

    .result-stat {
      display: grid;
      min-height: 72px;
      align-content: center;
      gap: 5px;
      border-right: 1px solid rgba(183, 226, 255, 0.08);
    }

    .result-stat:last-child {
      border-right: 0;
    }

    .result-stat span {
      color: rgba(218, 234, 255, 0.43);
      font-size: 9px;
      letter-spacing: 0.1em;
    }

    .result-stat strong {
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .result-actions {
      display: grid;
      width: 100%;
      gap: 10px;
      margin-top: 18px;
    }

    .result-actions .primary-button {
      margin-top: 0;
    }

    .secondary-button {
      width: 100%;
      border: 1px solid rgba(190, 226, 255, 0.11);
      color: rgba(223, 237, 255, 0.62);
      background: rgba(9, 14, 34, 0.46);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.07em;
      backdrop-filter: blur(10px);
    }

    .secondary-button:active {
      background: rgba(28, 38, 71, 0.7);
    }

    .small-mark {
      position: absolute;
      right: max(17px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 33;
      color: rgba(193, 219, 255, 0.21);
      font-size: 8px;
      font-weight: 650;
      letter-spacing: 0.2em;
      pointer-events: none;
    }

    .toast {
      position: absolute;
      top: 24%;
      left: 50%;
      z-index: 24;
      min-width: 128px;
      padding: 9px 15px;
      border: 1px solid rgba(255, 238, 165, 0.22);
      border-radius: 999px;
      color: #fff5c9;
      background: rgba(43, 37, 13, 0.7);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.24);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.055em;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
      backdrop-filter: blur(12px);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .live-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 600px) and (min-height: 650px) {
      body {
        padding: 16px;
      }

      .game {
        width: min(438px, calc(100vw - 32px));
        height: min(872px, calc(100dvh - 32px));
        border: 1px solid rgba(190, 226, 255, 0.12);
        border-radius: 30px;
        box-shadow:
          0 50px 150px rgba(0, 0, 0, 0.62),
          0 0 0 1px rgba(255, 255, 255, 0.02),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .game::before {
        border-radius: inherit;
      }
    }

    @media (max-height: 610px) {
      .orb-mark {
        width: 56px;
        height: 56px;
        margin-bottom: 10px;
      }

      .kicker {
        margin-bottom: 5px;
      }

      h1 {
        font-size: clamp(48px, 13vh, 68px);
      }

      .tagline {
        margin-top: 10px;
        line-height: 1.55;
      }

      .how-to {
        margin-top: 16px;
      }

      .primary-button {
        min-height: 48px;
        margin-top: 16px;
      }

      .meta-line {
        margin-top: 11px;
      }

      .result-screen h2 {
        margin-bottom: 12px;
      }

      .result-score {
        font-size: clamp(56px, 14vh, 74px);
      }

      .result-stats {
        margin-top: 15px;
      }

      .result-stat {
        min-height: 58px;
      }
    }

    @media (max-width: 360px) {
      .hud {
        gap: 6px;
        padding-right: max(10px, env(safe-area-inset-right));
        padding-left: max(10px, env(safe-area-inset-left));
      }

      .score {
        min-width: 70px;
      }

      #scoreValue {
        font-size: 24px;
      }

      .hud-actions {
        gap: 5px;
      }

      .shard-pill,
      .shield-pill {
        min-height: 34px;
        padding-right: 8px;
        padding-left: 8px;
      }

      .shield-pill {
        padding-right: 10px;
        padding-left: 10px;
      }

      .shield-pill span:last-child {
        display: none;
      }

      .icon-button {
        width: 34px;
        height: 34px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .screen {
        padding-top: max(10px, env(safe-area-inset-top));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      .screen--start .screen-inner {
        display: grid;
        width: min(92%, 710px);
        grid-template-columns: 1fr 280px;
        align-items: center;
        gap: 18px 38px;
        text-align: left;
      }

      .brand-lockup {
        align-items: flex-start;
      }

      .orb-mark {
        display: none;
      }

      h1 {
        font-size: clamp(52px, 18vh, 80px);
      }

      .tagline {
        max-width: 330px;
      }

      .start-cta {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      .how-to {
        justify-content: flex-start;
        margin-top: 10px;
      }

      .primary-button {
        max-width: none;
        margin-top: 15px;
      }

      .meta-line {
        justify-content: flex-start;
      }

      .result-screen .screen-inner {
        display: grid;
        width: min(90%, 670px);
        grid-template-columns: 1fr 1fr;
        gap: 12px 30px;
        text-align: left;
      }

      .result-copy {
        align-self: center;
      }

      .result-screen h2 {
        margin-bottom: 10px;
      }

      .result-stats {
        margin-top: 0;
      }

      .result-actions {
        margin-top: 0;
      }

      .small-mark {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sweep,
      .orb-mark::before,
      .orb-mark::after,
      .tap-glyph::after,
      .hint i,
      .primary-button::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="gameApp">
    <canvas id="gameCanvas" role="img" aria-label="浮光游戏场景：在上下两条霓虹轨道之间翻转重力，收集光碎片并避开晶体障碍。"></canvas>
    <div class="sweep" aria-hidden="true"></div>

    <header class="hud is-hidden" id="hud" aria-label="游戏状态">
      <div class="score">
        <span class="eyebrow">SCORE</span>
        <strong id="scoreValue">0000</strong>
      </div>
      <div class="hud-actions">
        <div class="shield-pill" id="shieldPill" hidden aria-label="护盾已就绪">
          <span aria-hidden="true">◇</span>
          <span>护盾</span>
        </div>
        <div class="shard-pill" aria-label="已收集光碎片">
          <span class="shard-icon" aria-hidden="true"></span>
          <span id="shardValue">0</span>
        </div>
        <button class="icon-button" id="soundButton" type="button" aria-label="关闭音效" aria-pressed="true">♪</button>
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停游戏">
          <span class="pause-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="hint" id="hint" aria-hidden="true">
      <span><i></i>轻触屏幕 · 翻转重力</span>
    </div>

    <section class="screen screen--start" id="startScreen" aria-labelledby="gameTitle">
      <div class="screen-inner">
        <div class="brand-lockup">
          <div class="orb-mark" aria-hidden="true"></div>
          <p class="kicker">ONE TAP · GRAVITY FLIP</p>
          <h1 id="gameTitle"><span>浮</span><span>光</span></h1>
          <p class="tagline">在两道霓虹轨道之间翻转重力。<br>追光，也追更远的分数。</p>
        </div>
        <div class="start-cta">
          <div class="how-to">
            <span class="tap-glyph" aria-hidden="true"></span>
            <span>轻触任意位置切换轨道</span>
          </div>
          <button class="primary-button" id="startButton" type="button">
            开始追光
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
          <div class="meta-line">
            <span>最高分 <b id="menuBest">0000</b></span>
            <span class="meta-dot" aria-hidden="true"></span>
            <span>手机浏览器 · 离线可玩</span>
          </div>
        </div>
      </div>
    </section>

    <section class="screen result-screen is-hidden" id="overScreen" aria-labelledby="overTitle">
      <div class="screen-inner">
        <div class="result-copy">
          <span class="result-kicker">RUN COMPLETE</span>
          <h2 id="overTitle">追光结束</h2>
          <div class="result-score" id="finalScore">0000</div>
          <div class="result-badge" id="newBestBadge" hidden>NEW BEST · 新纪录</div>
        </div>
        <div>
          <div class="result-stats">
            <div class="result-stat">
              <span>光碎片</span>
              <strong id="finalShards">0</strong>
            </div>
            <div class="result-stat">
              <span>最远距离</span>
              <strong id="finalDistance">0m</strong>
            </div>
            <div class="result-stat">
              <span>历史最高</span>
              <strong id="finalBest">0000</strong>
            </div>
          </div>
          <div class="result-actions">
            <button class="primary-button" id="retryButton" type="button">
              再来一局
              <span class="button-arrow" aria-hidden="true">→</span>
            </button>
            <button class="secondary-button" id="homeButton" type="button">返回首页</button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen is-hidden" id="pauseScreen" aria-labelledby="pauseTitle">
      <div class="screen-inner">
        <span class="result-kicker">PAUSED</span>
        <h2 id="pauseTitle" style="margin: 9px 0 28px; font-size: clamp(30px, 8vw, 40px); letter-spacing: -0.04em;">光芒暂歇</h2>
        <button class="primary-button" id="resumeButton" type="button">
          继续追光
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
        <button class="secondary-button" id="pauseRestartButton" type="button" style="margin-top: 10px;">重新开始</button>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="small-mark" aria-hidden="true">FLOAT / 01</div>
    <div class="live-status" id="liveStatus" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      "use strict";

      const app = document.getElementById("gameApp");
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d", { alpha: true });

      const hud = document.getElementById("hud");
      const scoreValue = document.getElementById("scoreValue");
      const shardValue = document.getElementById("shardValue");
      const shieldPill = document.getElementById("shieldPill");
      const hint = document.getElementById("hint");

      const startScreen = document.getElementById("startScreen");
      const overScreen = document.getElementById("overScreen");
      const pauseScreen = document.getElementById("pauseScreen");
      const startButton = document.getElementById("startButton");
      const retryButton = document.getElementById("retryButton");
      const homeButton = document.getElementById("homeButton");
      const resumeButton = document.getElementById("resumeButton");
      const pauseRestartButton = document.getElementById("pauseRestartButton");

      const pauseButton = document.getElementById("pauseButton");
      const soundButton = document.getElementById("soundButton");
      const menuBest = document.getElementById("menuBest");
      const finalScore = document.getElementById("finalScore");
      const finalShards = document.getElementById("finalShards");
      const finalDistance = document.getElementById("finalDistance");
      const finalBest = document.getElementById("finalBest");
      const newBestBadge = document.getElementById("newBestBadge");
      const toast = document.getElementById("toast");
      const liveStatus = document.getElementById("liveStatus");

      const STATE = Object.freeze({
        MENU: "menu",
        PLAYING: "playing",
        PAUSED: "paused",
        DYING: "dying",
        OVER: "over"
      });

      const COLORS = {
        cyan: "#73f7ff",
        aqua: "#83ffc8",
        violet: "#9f8cff",
        pink: "#ff70bd",
        danger: "#ff5d7d",
        gold: "#ffed9d",
        ink: "#f6fbff"
      };

      let state = STATE.MENU;
      let W = 0;
      let H = 0;
      let DPR = 1;
      let layout = { top: 0, bottom: 0, radius: 13, topRest: 0, bottomRest: 0 };

      let best = 0;
      let score = 0;
      let distance = 0;
      let shards = 0;
      let elapsed = 0;
      let speed = 250;
      let nextHazardAt = 1.65;
      let nextShieldAt = 16;
      let lastHazardLane = 1;
      let shieldReady = false;
      let invulnerable = 0;
      let shake = 0;
      let flash = 0;
      let dyingAt = 0;
      let backgroundOffset = 0;
      let hintTimer = 0;
      let toastTimer = 0;
      let lastFrame = performance.now();
      let lastScoreText = "";
      let lastShardText = "";
      let audioContext = null;
      let soundOn = true;
      let newRecord = false;

      const player = {
        x: 0,
        y: 0,
        vy: 0,
        gravity: 1,
        rotation: 0,
        alive: true,
        trail: [],
        wasMoving: false
      };

      let obstacles = [];
      let shardsInWorld = [];
      let particles = [];
      let rings = [];
      let stars = [];

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function readBest() {
        try {
          return Math.max(0, Number(localStorage.getItem("float-light-best")) || 0);
        } catch {
          return 0;
        }
      }

      function saveBest(value) {
        try {
          localStorage.setItem("float-light-best", String(value));
        } catch {
          // Local storage can be unavailable when opening a local file in private mode.
        }
      }

      function readSoundPreference() {
        try {
          return localStorage.getItem("float-light-sound") !== "off";
        } catch {
          return true;
        }
      }

      function saveSoundPreference() {
        try {
          localStorage.setItem("float-light-sound", soundOn ? "on" : "off");
        } catch {
          // Sound preference is optional.
        }
      }

      function formatScore(value) {
        return String(Math.max(0, Math.floor(value))).padStart(4, "0");
      }

      function setLiveStatus(message) {
        liveStatus.textContent = message;
      }

      function updateSoundButton() {
        soundButton.textContent = soundOn ? "♪" : "×";
        soundButton.setAttribute("aria-label", soundOn ? "关闭音效" : "开启音效");
        soundButton.setAttribute("aria-pressed", String(soundOn));
      }

      function setupAudio() {
        if (!soundOn) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioContext) {
          audioContext = new AudioContextClass();
        }
        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
      }

      function tone(fromFrequency, toFrequency, duration, type = "sine", volume = 0.02) {
        if (!soundOn || !audioContext) return;
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(fromFrequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, toFrequency), now + duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + duration + 0.02);
      }

      function sfxFlip() {
        tone(520, 275, 0.085, "triangle", 0.022);
      }

      function sfxCollect() {
        tone(760, 1320, 0.09, "sine", 0.016);
      }

      function sfxShield() {
        tone(420, 1060, 0.2, "triangle", 0.025);
      }

      function sfxShieldBreak() {
        tone(300, 82, 0.28, "square", 0.022);
      }

      function sfxHit() {
        tone(145, 42, 0.42, "sawtooth", 0.035);
        window.setTimeout(() => tone(280, 64, 0.24, "square", 0.018), 45);
      }

      function vibrate(pattern) {
        if (typeof navigator.vibrate === "function") {
          navigator.vibrate(pattern);
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1300);
      }

      function showHintFor(milliseconds) {
        hint.classList.add("is-visible");
        clearTimeout(hintTimer);
        hintTimer = window.setTimeout(() => hint.classList.remove("is-visible"), milliseconds);
      }

      function hideHint() {
        clearTimeout(hintTimer);
        hint.classList.remove("is-visible");
      }

      function setScreen(screen, visible) {
        screen.classList.toggle("is-hidden", !visible);
      }

      function setHudVisible(visible) {
        hud.classList.toggle("is-hidden", !visible);
        hud.inert = !visible;
        hud.setAttribute("aria-hidden", String(!visible));
      }

      function updateHud(force = false) {
        const scoreText = formatScore(score);
        const shardText = String(shards);
        if (force || scoreText !== lastScoreText) {
          scoreValue.textContent = scoreText;
          lastScoreText = scoreText;
        }
        if (force || shardText !== lastShardText) {
          shardValue.textContent = shardText;
          lastShardText = shardText;
        }
        shieldPill.hidden = !shieldReady;
      }

      function rebuildStars() {
        const count = Math.round(clamp((W * H) / 7200, 46, 104));
        stars = Array.from({ length: count }, () => {
          const layer = Math.random();
          return {
            x: Math.random() * W,
            y: Math.random() * H,
            size: layer > 0.85 ? random(1.1, 2.1) : random(0.35, 1.25),
            alpha: random(0.15, 0.72),
            layer: layer > 0.78 ? 2 : 1,
            phase: random(0, Math.PI * 2)
          };
        });
      }

      function calculateLayout() {
        const radius = clamp(Math.min(W, H) * 0.029, 10, 15);
        const top = clamp(H * 0.205, 92, 194);
        const bottom = Math.min(H - clamp(H * 0.12, 62, 104), top + Math.max(140, H * 0.59));
        return {
          top,
          bottom,
          radius,
          topRest: top + radius + 5,
          bottomRest: bottom - radius - 5
        };
      }

      function resize() {
        W = Math.max(280, app.clientWidth);
        H = Math.max(320, app.clientHeight);
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        layout = calculateLayout();
        player.x = Math.max(74, W * 0.235);
        if (state === STATE.MENU) {
          player.y = layout.bottomRest;
        } else {
          player.y = clamp(player.y, layout.topRest, layout.bottomRest);
        }
        rebuildStars();
      }

      function resetRun() {
        score = 0;
        distance = 0;
        shards = 0;
        elapsed = 0;
        speed = 250;
        nextHazardAt = 1.55;
        nextShieldAt = 15.5;
        lastHazardLane = 1;
        shieldReady = false;
        invulnerable = 0;
        shake = 0;
        flash = 0;
        newRecord = false;
        obstacles = [];
        shardsInWorld = [];
        particles = [];
        rings = [];
        player.gravity = 1;
        player.vy = 0;
        player.rotation = 0;
        player.alive = true;
        player.wasMoving = false;
        player.x = Math.max(74, W * 0.235);
        player.y = layout.bottomRest;
        player.trail = [];
        for (let i = 0; i < 4; i += 1) {
          shardsInWorld.push({
            x: W + 62 + i * 38,
            lane: 1,
            kind: "shard",
            phase: random(0, Math.PI * 2),
            alive: true
          });
        }
        updateHud(true);
        setLiveStatus("游戏开始。轻触屏幕翻转重力。");
      }

      function startGame() {
        setupAudio();
        resetRun();
        state = STATE.PLAYING;
        setScreen(startScreen, false);
        setScreen(overScreen, false);
        setScreen(pauseScreen, false);
        setHudVisible(true);
        if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
        showHintFor(3200);
        tone(220, 660, 0.26, "sine", 0.018);
        updateSoundButton();
      }

      function returnToMenu() {
        state = STATE.MENU;
        resetRun();
        setHudVisible(false);
        hideHint();
        setScreen(pauseScreen, false);
        setScreen(overScreen, false);
        setScreen(startScreen, true);
        menuBest.textContent = formatScore(best);
        player.alive = true;
        player.gravity = 1;
        player.y = layout.bottomRest;
        updateHud(true);
        setLiveStatus("已返回首页。");
      }

      function flipGravity() {
        if (state !== STATE.PLAYING || !player.alive) return;
        player.gravity *= -1;
        player.vy = player.gravity * Math.min(430, 220 + speed * 0.24);
        rings.push({
          x: player.x,
          y: player.y,
          radius: layout.radius * 1.2,
          life: 1
        });
        for (let i = 0; i < 7; i += 1) {
          particles.push({
            x: player.x + random(-5, 5),
            y: player.y + random(-5, 5),
            vx: random(-85, 35),
            vy: random(-55, 55) + player.gravity * 12,
            life: random(0.22, 0.48),
            maxLife: 0.5,
            size: random(0.8, 2),
            color: i % 3 === 0 ? COLORS.violet : COLORS.cyan,
            drag: 0.94
          });
        }
        sfxFlip();
        vibrate(7);
        hideHint();
      }

      function pauseGame() {
        if (state !== STATE.PLAYING) return;
        state = STATE.PAUSED;
        setHudVisible(false);
        setScreen(pauseScreen, true);
        hideHint();
        setLiveStatus("游戏已暂停。");
        window.setTimeout(() => resumeButton.focus({ preventScroll: true }), 40);
      }

      function resumeGame() {
        if (state !== STATE.PAUSED) return;
        setupAudio();
        state = STATE.PLAYING;
        setScreen(pauseScreen, false);
        setHudVisible(true);
        if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
        lastFrame = performance.now();
        setLiveStatus("继续游戏。");
      }

      function restartFromPause() {
        setScreen(pauseScreen, false);
        startGame();
      }

      function obstacleMaxHeight() {
        const corridor = Math.max(140, layout.bottom - layout.top);
        return clamp(corridor * 0.37, 50, 155);
      }

      function spawnHazard() {
        let lane = Math.random() < 0.5 ? -1 : 1;
        if (lane === lastHazardLane) lane *= -1;
        lastHazardLane = lane;

        const difficulty = clamp(elapsed / 52, 0, 1);
        const maxHeight = obstacleMaxHeight();
        const height = maxHeight * random(0.66, 1) * lerp(0.76, 1, difficulty);
        obstacles.push({
          x: W + 54,
          lane,
          width: clamp(W * 0.09, 32, 44),
          height,
          phase: random(0, 1),
          alive: true
        });

        const safeLane = -lane;
        const trailCount = Math.random() < 0.45 ? 4 : 3;
        for (let i = 0; i < trailCount; i += 1) {
          shardsInWorld.push({
            x: W + 8 + i * 35,
            lane: safeLane,
            kind: "shard",
            phase: random(0, Math.PI * 2),
            alive: true
          });
        }

        const interval = lerp(1.34, 0.76, difficulty);
        nextHazardAt = elapsed + interval * random(0.9, 1.08);
      }

      function spawnShield() {
        const lane = Math.random() < 0.5 ? -1 : 1;
        shardsInWorld.push({
          x: W + 70,
          lane,
          kind: "shield",
          phase: random(0, Math.PI * 2),
          alive: true
        });
        nextShieldAt = elapsed + random(17, 22);
      }

      function updatePlayer(dt) {
        const radius = layout.radius;
        const wasMoving = Math.abs(player.vy) > 60;
        player.wasMoving = wasMoving;
        player.vy += player.gravity * 2700 * dt;
        player.vy = clamp(player.vy, -1650, 1650);
        player.y += player.vy * dt;
        player.rotation += player.gravity * (5.6 + speed * 0.007) * dt;

        if (player.gravity > 0 && player.y >= layout.bottomRest) {
          if (player.vy > 680) {
            burst(player.x, layout.bottomRest + radius * 0.45, 5, COLORS.cyan, 1.15);
          }
          player.y = layout.bottomRest;
          player.vy = 0;
        } else if (player.gravity < 0 && player.y <= layout.topRest) {
          if (player.vy < -680) {
            burst(player.x, layout.topRest - radius * 0.45, 5, COLORS.pink, 1.15);
          }
          player.y = layout.topRest;
          player.vy = 0;
        }

        player.trail.unshift({ x: player.x, y: player.y });
        if (player.trail.length > 14) player.trail.pop();
      }

      function moveWorld(dt) {
        const travel = speed * dt;
        backgroundOffset += travel * 0.85;

        obstacles.forEach((obstacle) => {
          obstacle.x -= travel;
        });
        shardsInWorld.forEach((shard) => {
          shard.x -= travel;
        });

        obstacles = obstacles.filter((obstacle) => obstacle.alive && obstacle.x > -obstacle.width - 30);
        shardsInWorld = shardsInWorld.filter((shard) => shard.alive && shard.x > -30);

        stars.forEach((star) => {
          star.x -= travel * (star.layer === 2 ? 0.055 : 0.022);
          if (star.x < -3) {
            star.x = W + random(4, 36);
            star.y = Math.random() * H;
          }
        });
      }

      function circleHitsRect(cx, cy, radius, rectX, rectY, rectW, rectH) {
        const closestX = clamp(cx, rectX, rectX + rectW);
        const closestY = clamp(cy, rectY, rectY + rectH);
        const dx = cx - closestX;
        const dy = cy - closestY;
        return dx * dx + dy * dy < radius * radius;
      }

      function obstacleRect(obstacle) {
        const half = obstacle.width * 0.34;
        if (obstacle.lane > 0) {
          return {
            x: obstacle.x - half,
            y: layout.bottom - obstacle.height + 5,
            width: half * 2,
            height: obstacle.height - 3
          };
        }
        return {
          x: obstacle.x - half,
          y: layout.top - 2,
          width: half * 2,
          height: obstacle.height - 3
        };
      }

      function laneRestY(lane) {
        return lane > 0 ? layout.bottomRest : layout.topRest;
      }

      function checkCollisions() {
        const bodyRadius = layout.radius * 0.79;

        for (const obstacle of obstacles) {
          if (!obstacle.alive) continue;
          const rect = obstacleRect(obstacle);
          if (!circleHitsRect(player.x, player.y, bodyRadius, rect.x, rect.y, rect.width, rect.height)) {
            continue;
          }

          if (invulnerable > 0) continue;

          if (shieldReady) {
            shieldReady = false;
            obstacle.alive = false;
            invulnerable = 1.15;
            shake = Math.max(shake, 8);
            flash = Math.max(flash, 0.23);
            burst(obstacle.x, obstacle.lane > 0 ? layout.bottom - obstacle.height * 0.6 : layout.top + obstacle.height * 0.6, 24, COLORS.gold, 2.1);
            showToast("护盾抵消");
            setLiveStatus("护盾抵消了一次撞击。");
            sfxShieldBreak();
            vibrate([12, 26, 18]);
            updateHud(true);
            break;
          }

          endRun();
          return;
        }

        for (const shard of shardsInWorld) {
          if (!shard.alive) continue;
          const centerY = laneRestY(shard.lane);
          const dx = shard.x - player.x;
          const dy = centerY - player.y;
          const radius = shard.kind === "shield" ? 17 : 13;
          if (dx * dx + dy * dy > radius * radius) continue;

          shard.alive = false;
          if (shard.kind === "shield") {
            shieldReady = true;
            showToast("护盾已就绪");
            burst(shard.x, centerY, 18, COLORS.gold, 1.75);
            rings.push({ x: shard.x, y: centerY, radius: 12, life: 1 });
            setLiveStatus("获得护盾。下一次撞击将被抵消。");
            sfxShield();
            vibrate(20);
          } else {
            shards += 1;
            burst(shard.x, centerY, 7, shard.lane > 0 ? COLORS.cyan : COLORS.pink, 1);
            sfxCollect();
          }
          updateHud();
        }
      }

      function burst(x, y, amount, color, force = 1) {
        for (let i = 0; i < amount; i += 1) {
          const angle = random(0, Math.PI * 2);
          const velocity = random(28, 175) * force;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            life: random(0.22, 0.72),
            maxLife: 0.72,
            size: random(0.8, 2.8) * Math.min(force, 1.7),
            color,
            drag: random(0.91, 0.97)
          });
        }
        if (particles.length > 180) {
          particles.splice(0, particles.length - 180);
        }
      }

      function updateParticles(dt) {
        for (const particle of particles) {
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.pow(particle.drag, dt * 60);
          particle.vy *= Math.pow(particle.drag, dt * 60);
          particle.vy += 22 * dt;
        }
        particles = particles.filter((particle) => particle.life > 0);

        for (const ring of rings) {
          ring.life -= dt * 2.25;
          ring.radius += dt * 120;
        }
        rings = rings.filter((ring) => ring.life > 0);
      }

      function endRun() {
        if (state !== STATE.PLAYING) return;
        state = STATE.DYING;
        dyingAt = performance.now();
        player.alive = false;
        shake = 17;
        flash = 0.62;
        burst(player.x, player.y, 34, COLORS.cyan, 2.3);
        burst(player.x, player.y, 18, COLORS.pink, 1.7);
        sfxHit();
        vibrate([38, 35, 70]);
        hideHint();
        setLiveStatus("撞击。本轮结束。");
      }

      function finishRun() {
        if (state !== STATE.DYING) return;
        state = STATE.OVER;
        newRecord = score > best;
        if (newRecord) {
          best = score;
          saveBest(best);
        }
        finalScore.textContent = formatScore(score);
        finalShards.textContent = String(shards);
        finalDistance.textContent = Math.floor(distance / 11) + "m";
        finalBest.textContent = formatScore(best);
        newBestBadge.hidden = !newRecord;
        menuBest.textContent = formatScore(best);
        setHudVisible(false);
        setScreen(overScreen, true);
        setLiveStatus(`本轮结束，得分 ${score}。最高分 ${best}。`);
        window.setTimeout(() => retryButton.focus({ preventScroll: true }), 40);
      }

      function update(dt) {
        elapsed += dt;
        speed = 250 + Math.min(360, elapsed * 6.8);
        distance += speed * dt;
        score = Math.floor(distance * 0.095) + shards * 18;
        updateHud();

        updatePlayer(dt);
        moveWorld(dt);

        if (elapsed >= nextHazardAt) {
          spawnHazard();
        }
        if (elapsed >= nextShieldAt) {
          spawnShield();
        }

        invulnerable = Math.max(0, invulnerable - dt);
        checkCollisions();
        updateParticles(dt);
        shake *= Math.pow(0.035, dt);
        flash = Math.max(0, flash - dt * 2.8);
      }

      function updateAttract(dt) {
        backgroundOffset += 24 * dt;
        stars.forEach((star) => {
          star.x -= dt * (star.layer === 2 ? 10 : 3);
          if (star.x < -3) {
            star.x = W + random(4, 36);
            star.y = Math.random() * H;
          }
        });
        player.rotation += dt * 0.8;
        updateParticles(dt);
      }

      function updateDying(dt) {
        updateParticles(dt);
        shake *= Math.pow(0.032, dt);
        flash = Math.max(0, flash - dt * 2.8);
        if (performance.now() - dyingAt > 720) {
          finishRun();
        }
      }

      function drawStarfield() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const star of stars) {
          const twinkle = 0.58 + Math.sin(elapsed * 1.7 + star.phase) * 0.24;
          ctx.globalAlpha = star.alpha * twinkle;
          ctx.fillStyle = star.layer === 2 ? COLORS.violet : COLORS.cyan;
          if (star.size > 1.35) {
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 8;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        const haze = ctx.createLinearGradient(0, H * 0.28, W, H * 0.72);
        haze.addColorStop(0, "rgba(73, 70, 172, 0)");
        haze.addColorStop(0.48, "rgba(77, 75, 193, 0.045)");
        haze.addColorStop(1, "rgba(26, 194, 196, 0)");
        ctx.fillStyle = haze;
        ctx.fillRect(0, H * 0.22, W, H * 0.56);
      }

      function drawTracks() {
        const { top, bottom } = layout;

        const ceilingFill = ctx.createLinearGradient(0, 0, 0, top);
        ceilingFill.addColorStop(0, "rgba(12, 18, 45, 0.75)");
        ceilingFill.addColorStop(0.8, "rgba(13, 17, 42, 0.28)");
        ceilingFill.addColorStop(1, "rgba(13, 17, 42, 0.02)");
        ctx.fillStyle = ceilingFill;
        ctx.fillRect(0, 0, W, top);

        const floorFill = ctx.createLinearGradient(0, bottom, 0, H);
        floorFill.addColorStop(0, "rgba(16, 13, 43, 0.03)");
        floorFill.addColorStop(0.22, "rgba(16, 13, 43, 0.28)");
        floorFill.addColorStop(1, "rgba(10, 12, 32, 0.72)");
        ctx.fillStyle = floorFill;
        ctx.fillRect(0, bottom, W, H - bottom);

        const topGradient = ctx.createLinearGradient(0, 0, W, 0);
        topGradient.addColorStop(0, "rgba(159, 140, 255, 0.08)");
        topGradient.addColorStop(0.26, "rgba(159, 140, 255, 0.82)");
        topGradient.addColorStop(0.68, "rgba(115, 247, 255, 0.62)");
        topGradient.addColorStop(1, "rgba(115, 247, 255, 0.08)");

        const bottomGradient = ctx.createLinearGradient(0, 0, W, 0);
        bottomGradient.addColorStop(0, "rgba(255, 112, 189, 0.08)");
        bottomGradient.addColorStop(0.32, "rgba(255, 112, 189, 0.76)");
        bottomGradient.addColorStop(0.74, "rgba(131, 255, 200, 0.55)");
        bottomGradient.addColorStop(1, "rgba(131, 255, 200, 0.06)");

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.lineWidth = 1.15;
        ctx.strokeStyle = topGradient;
        ctx.shadowColor = "rgba(134, 169, 255, 0.48)";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(0, top);
        ctx.lineTo(W, top);
        ctx.stroke();

        ctx.strokeStyle = bottomGradient;
        ctx.shadowColor = "rgba(255, 112, 189, 0.42)";
        ctx.beginPath();
        ctx.moveTo(0, bottom);
        ctx.lineTo(W, bottom);
        ctx.stroke();
        ctx.restore();

        const spacing = 58;
        const shift = -(backgroundOffset % spacing);
        ctx.save();
        ctx.lineWidth = 1;
        for (let x = shift - spacing; x < W + spacing; x += spacing) {
          ctx.strokeStyle = "rgba(181, 221, 255, 0.065)";
          ctx.beginPath();
          ctx.moveTo(x, top + 8);
          ctx.lineTo(x + 18, top + 24);
          ctx.stroke();

          ctx.strokeStyle = "rgba(255, 139, 203, 0.05)";
          ctx.beginPath();
          ctx.moveTo(x, bottom - 8);
          ctx.lineTo(x + 18, bottom - 24);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(167, 204, 255, 0.032)";
        for (let i = 1; i < 4; i += 1) {
          const y = lerp(top, bottom, i / 4);
          ctx.setLineDash([1, 20]);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();
      }

      function drawObstacle(obstacle) {
        const width = obstacle.width;
        const half = width * 0.5;
        const x = obstacle.x;
        const lane = obstacle.lane;
        const baseY = lane > 0 ? layout.bottom : layout.top;
        const tipY = baseY - lane * obstacle.height;
        const pulse = 0.8 + Math.sin(elapsed * 4.8 + obstacle.phase * 7) * 0.14;

        ctx.save();
        ctx.translate(x, baseY);
        if (lane < 0) ctx.scale(1, -1);

        const gradient = ctx.createLinearGradient(0, 0, 0, -obstacle.height);
        gradient.addColorStop(0, "rgba(255, 69, 129, 0.78)");
        gradient.addColorStop(0.37, "rgba(255, 85, 146, 0.55)");
        gradient.addColorStop(1, "rgba(255, 131, 190, 0.14)");

        ctx.shadowColor = "rgba(255, 76, 141, 0.68)";
        ctx.shadowBlur = 18 * pulse;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(-half, 0);
        ctx.lineTo(-half * 0.76, -obstacle.height * 0.64);
        ctx.lineTo(-half * 0.34, -obstacle.height * 0.51);
        ctx.lineTo(-half * 0.09, -obstacle.height);
        ctx.lineTo(half * 0.2, -obstacle.height * 0.72);
        ctx.lineTo(half * 0.48, -obstacle.height * 0.84);
        ctx.lineTo(half, 0);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255, 203, 227, 0.5)";
        ctx.beginPath();
        ctx.moveTo(-half * 0.1, -3);
        ctx.lineTo(-half * 0.08, -obstacle.height * 0.92);
        ctx.lineTo(half * 0.45, -3);
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 241, 248, 0.46)";
        ctx.beginPath();
        ctx.moveTo(-half * 0.06, -obstacle.height * 0.92);
        ctx.lineTo(half * 0.1, -obstacle.height * 0.8);
        ctx.lineTo(-half * 0.02, -obstacle.height * 0.82);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = COLORS.danger;
        ctx.filter = "blur(5px)";
        ctx.beginPath();
        ctx.arc(x, lane > 0 ? tipY + obstacle.height * 0.12 : tipY - obstacle.height * 0.12, width * 0.23, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawShard(shard) {
        const y = laneRestY(shard.lane);
        const spin = elapsed * 1.55 + shard.phase;
        const bob = Math.sin(elapsed * 2.6 + shard.phase) * 2;

        ctx.save();
        ctx.translate(shard.x, y + bob);
        ctx.rotate(spin);
        ctx.globalCompositeOperation = "lighter";

        if (shard.kind === "shield") {
          ctx.strokeStyle = "rgba(255, 238, 157, 0.55)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.stroke();
          ctx.rotate(-spin * 1.4);
          ctx.shadowColor = COLORS.gold;
          ctx.shadowBlur = 18;
          ctx.fillStyle = COLORS.gold;
          ctx.beginPath();
          ctx.moveTo(0, -9);
          ctx.lineTo(8, 0);
          ctx.lineTo(0, 9);
          ctx.lineTo(-8, 0);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255, 255, 239, 0.88)";
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.shadowColor = shard.lane > 0 ? COLORS.cyan : COLORS.pink;
          ctx.shadowBlur = 15;
          ctx.fillStyle = shard.lane > 0 ? COLORS.cyan : "#ff9cd2";
          ctx.beginPath();
          ctx.moveTo(0, -8);
          ctx.lineTo(6.5, 0);
          ctx.lineTo(0, 8);
          ctx.lineTo(-6.5, 0);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
          ctx.beginPath();
          ctx.moveTo(0, -4.5);
          ctx.lineTo(3.4, 0);
          ctx.lineTo(0, 4.5);
          ctx.lineTo(-3.4, 0);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawPlayer() {
        if (!player.alive || state === STATE.PAUSED) return;
        if (invulnerable > 0 && Math.floor(invulnerable * 11) % 2 === 0) {
          ctx.globalAlpha = 0.48;
        }

        const radius = layout.radius;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (let i = player.trail.length - 1; i >= 0; i -= 1) {
          const point = player.trail[i];
          const alpha = (1 - i / player.trail.length) * 0.12;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = i % 3 === 0 ? COLORS.violet : COLORS.cyan;
          ctx.beginPath();
          ctx.arc(point.x - i * 5.5, point.y + Math.sin(i * 0.7 + elapsed * 3) * 2, radius * (1 - i * 0.045), 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 26;
        const aura = ctx.createRadialGradient(player.x, player.y, 1, player.x, player.y, radius * 2.5);
        aura.addColorStop(0, "rgba(224, 255, 255, 0.52)");
        aura.addColorStop(0.38, "rgba(115, 247, 255, 0.18)");
        aura.addColorStop(1, "rgba(115, 247, 255, 0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(player.x, player.y, radius * 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(player.x, player.y);
        ctx.rotate(player.rotation * 0.32);
        ctx.shadowBlur = 16;
        const body = ctx.createRadialGradient(-radius * 0.3, -radius * 0.35, 1, 0, 0, radius);
        body.addColorStop(0, "#ffffff");
        body.addColorStop(0.22, "#d9ffff");
        body.addColorStop(0.58, "#6cecff");
        body.addColorStop(1, "#8b73ff");
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
        ctx.beginPath();
        ctx.arc(-radius * 0.27, -radius * 0.34, radius * 0.21, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = "rgba(217, 253, 255, 0.76)";
        ctx.lineWidth = 1;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 9;
        ctx.beginPath();
        ctx.ellipse(player.x, player.y, radius * 1.72, radius * 0.55, -0.44, 0.25, Math.PI * 1.65);
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(player.x + radius * 1.38, player.y - radius * 0.4, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.globalAlpha = 1;
      }

      function drawParticles() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const particle of particles) {
          ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
          ctx.fillStyle = particle.color;
          ctx.shadowColor = particle.color;
          ctx.shadowBlur = 7;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const ring of rings) {
          ctx.globalAlpha = clamp(ring.life, 0, 1) * 0.45;
          ctx.strokeStyle = COLORS.cyan;
          ctx.lineWidth = 1;
          ctx.shadowColor = COLORS.cyan;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        ctx.save();
        if (shake > 0.3) {
          ctx.translate(random(-shake, shake), random(-shake, shake));
        }

        drawStarfield();
        drawTracks();

        if (state === STATE.MENU) {
          const guideX = W * 0.71;
          const guideY = layout.bottomRest;
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.shadowColor = COLORS.cyan;
          ctx.shadowBlur = 24;
          const aura = ctx.createRadialGradient(guideX, guideY, 1, guideX, guideY, 32);
          aura.addColorStop(0, "rgba(245, 255, 255, 0.78)");
          aura.addColorStop(0.25, "rgba(115, 247, 255, 0.42)");
          aura.addColorStop(1, "rgba(115, 247, 255, 0)");
          ctx.fillStyle = aura;
          ctx.beginPath();
          ctx.arc(guideX, guideY, 32, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#bffcff";
          ctx.beginPath();
          ctx.arc(guideX, guideY, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          for (const obstacle of obstacles) drawObstacle(obstacle);
          for (const shard of shardsInWorld) drawShard(shard);
          drawParticles();
          drawPlayer();
        }

        ctx.restore();

        if (flash > 0) {
          ctx.save();
          ctx.globalAlpha = flash;
          ctx.fillStyle = "#dffcff";
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
      }

      function frame(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.034);
        lastFrame = now;

        if (state === STATE.PLAYING) {
          update(dt);
        } else if (state === STATE.DYING) {
          updateDying(dt);
        } else if (state === STATE.MENU) {
          updateAttract(dt);
        }

        draw();
        requestAnimationFrame(frame);
      }

      startButton.addEventListener("click", startGame);
      retryButton.addEventListener("click", startGame);
      homeButton.addEventListener("click", returnToMenu);
      resumeButton.addEventListener("click", resumeGame);
      pauseRestartButton.addEventListener("click", restartFromPause);
      pauseButton.addEventListener("click", pauseGame);
      soundButton.addEventListener("click", () => {
        soundOn = !soundOn;
        saveSoundPreference();
        updateSoundButton();
        if (soundOn) {
          setupAudio();
          tone(520, 820, 0.12, "sine", 0.02);
        }
      });

      app.addEventListener("pointerdown", (event) => {
        if (state !== STATE.PLAYING) return;
        if (event.target.closest("button")) return;
        event.preventDefault();
        flipGravity();
      }, { passive: false });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp" || event.code === "ArrowDown" || event.code === "KeyW" || event.code === "KeyS") {
          if (state === STATE.PLAYING) {
            event.preventDefault();
            flipGravity();
          }
        } else if (event.code === "Escape" || event.code === "KeyP") {
          if (state === STATE.PLAYING) {
            event.preventDefault();
            pauseGame();
          } else if (state === STATE.PAUSED) {
            event.preventDefault();
            resumeGame();
          }
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === STATE.PLAYING) {
          pauseGame();
        }
      });

      window.addEventListener("contextmenu", (event) => {
        if (event.target.closest("#gameApp")) event.preventDefault();
      });

      let resizeFrame = 0;
      const queueResize = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(resize);
      };
      window.addEventListener("resize", queueResize);
      window.addEventListener("orientationchange", queueResize);

      best = readBest();
      soundOn = readSoundPreference();
      updateSoundButton();
      resize();
      player.y = layout.bottomRest;
      menuBest.textContent = formatScore(best);
      setHudVisible(false);
      updateHud(true);
      requestAnimationFrame(frame);
    })();
  </script>
  <script>
    (() => {
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol !== "http:" && location.protocol !== "https:") return;
      const register = () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
      if (document.readyState === "complete") register();
      else window.addEventListener("load", register, { once: true });
    })();
  </script>
</body>
</html>
